name = "freelance-bot"
main = "worker.js"
compatibility_date = "2025-06-01"

# Cron كل دقيقة
[triggers]
crons = ["* * * * *"]

# قاعدة البيانات: اعملها بـ  npx wrangler d1 create jobs
# وحط الـ database_id اللي هيطلعلك هنا
[[d1_databases]]
binding = "DB"
database_name = "jobs"
database_id = "b5084387-fa31-4f9a-bbb8-ecc1beff9c88"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

{
  // ...
  "vars": {
    "ADMIN_ID": "8571353627"
  },
  // ...
}

# الـ Secrets بتتضاف بالأوامر دي (مش هنا):
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put ADMIN_KEY
#   npx wrangler secret put ADMIN_ID      (اختياري)
